services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: bankflow-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: ./BankFlow.Api/Dockerfile
    container_name: bankflow-api
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BankFlowDb=Server=sqlserver;Database=BankFlow;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};TrustServerCertificate=True
      - ConnectionStrings__AuthDb=Data Source=/data/bankflow-auth.db
      - Bootstrap__Email=${BOOTSTRAP_EMAIL:-}
      - Bootstrap__Password=${BOOTSTRAP_PASSWORD:-}
      - Bootstrap__ExecutiveEmail=${BOOTSTRAP_EXECUTIVE_EMAIL:-}
      - Bootstrap__ExecutivePassword=${BOOTSTRAP_EXECUTIVE_PASSWORD:-}
    volumes:
      - auth_data:/data
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    ports:
      - "8080:8080"

  web:
    build:
      context: ./BankFlow.Web
    depends_on:
      - api
    ports:
      - "4200:80"

volumes:
  sqlserver_data:
  auth_data:
  data_protection_keys:
